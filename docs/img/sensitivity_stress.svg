<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Дни стресса растений при ошибках входных данных" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Дни стресса растений при ошибках входных данных</title><rect width="760" height="330" rx="12" fill="#ffffff" stroke="#d1e0d4"/><text x="24.0" y="32.0" font-size="17" text-anchor="start" font-weight="700" fill="#1c2b1e">Дни стресса растений за сезон (хлопок, капля)</text><text x="24.0" y="52.0" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280">Случайные ошибки почти безвредны; систематическая ошибка копится — и исправляется проверкой почвы</text><text x="258.0" y="99.0" font-size="13" text-anchor="end" font-weight="400" fill="#1c2b1e">Идеальный прогноз</text><rect x="270" y="82" width="0.0" height="24" rx="4" fill="#1a7a4a"/><text x="278.0" y="99.0" font-size="13" text-anchor="start" font-weight="700" fill="#1c2b1e">0.0</text><text x="258.0" y="135.0" font-size="13" text-anchor="end" font-weight="400" fill="#1c2b1e">Случайная ошибка ET₀ ±30%</text><rect x="270" y="118" width="0.0" height="24" rx="4" fill="#1a7a4a"/><text x="278.0" y="135.0" font-size="13" text-anchor="start" font-weight="700" fill="#1c2b1e">0.0</text><text x="258.0" y="171.0" font-size="13" text-anchor="end" font-weight="400" fill="#1c2b1e">Дожди не учтены</text><rect x="270" y="154" width="0.0" height="24" rx="4" fill="#1a7a4a"/><text x="278.0" y="171.0" font-size="13" text-anchor="start" font-weight="700" fill="#1c2b1e">0.0</text><text x="258.0" y="207.0" font-size="13" text-anchor="end" font-weight="400" fill="#1c2b1e">Неверная почва</text><rect x="270" y="190" width="0.0" height="24" rx="4" fill="#1a7a4a"/><text x="278.0" y="207.0" font-size="13" text-anchor="start" font-weight="700" fill="#1c2b1e">0.0</text><text x="258.0" y="243.0" font-size="13" text-anchor="end" font-weight="600" fill="#1c2b1e">ET₀ занижена на 20%</text><rect x="270" y="226" width="390.9" height="24" rx="4" fill="#d97706"/><text x="668.9" y="243.0" font-size="13" text-anchor="start" font-weight="700" fill="#1c2b1e">72.8</text><text x="258.0" y="279.0" font-size="13" text-anchor="end" font-weight="400" fill="#1c2b1e">…и проверка влажности раз в 7 дней</text><rect x="270" y="262" width="0.0" height="24" rx="4" fill="#1a7a4a"/><text x="278.0" y="279.0" font-size="13" text-anchor="start" font-weight="700" fill="#1c2b1e">0.0</text><text x="744.0" y="316.0" font-size="11" text-anchor="end" font-weight="400" fill="#6b7280">модель на реальной погоде, 5 регионов × 5 сезонов</text></svg>