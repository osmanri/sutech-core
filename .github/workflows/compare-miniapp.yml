name: compare-miniapp
# Read-only: builds the Mini App from the repository and shows how it differs from the files live on the server.
# Changes nothing. Run: Actions -> compare-miniapp -> Run workflow.
on:
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Write bot/.env from the secret
        env:
          BOT_ENV: ${{ secrets.BOT_ENV }}
        run: |
          test -n "$BOT_ENV" || { echo "Secret BOT_ENV is empty"; exit 1; }
          printf '%s\n' "$BOT_ENV" > bot/.env
      - name: Build, download live files, diff
        working-directory: serverless
        run: |
          npm ci --ignore-scripts
          npm run build
          node cli.mjs status || true
          echo "=== public live files vs repository build (ignoring CR/LF) ==="
          BASE=https://app8796056339.tgcloud.ai
          mkdir -p /tmp/live
          (cd dist && find . -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.svg' -o -name 'LICENSE' \) | sed 's|^\./||') | while read f; do
            mkdir -p "/tmp/live/$(dirname "$f")"
            curl -fsS "$BASE/$f" -o "/tmp/live/$f" || echo "missing live: $f"
            if diff -q --strip-trailing-cr "dist/$f" "/tmp/live/$f" >/dev/null; then :; else echo "DIFFERS: $f"; diff -u --strip-trailing-cr "/tmp/live/$f" "dist/$f" | head -60; fi
          done
