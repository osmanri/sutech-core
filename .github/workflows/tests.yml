name: tests
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_water_balance tests.test_water_stress tests.test_et0 tests.test_experiment tests.test_hardware_bridge tests.test_research_simulation tests.test_calculation_audit
      - name: Whole suite incl. the Telegram bot (dummy token, no network)
        run: pip install -r bot/requirements.txt && python run_tests.py
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pump and flow-meter logic compiled and run on the PC
        working-directory: firmware/host_test
        run: g++ -std=c++17 -Wall -I. test_firmware.cpp -o test_firmware && ./test_firmware
  serverless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bot, calculation engine parity and Mini App transport
        working-directory: serverless
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Frontend regression tests and production build
        working-directory: serverless
        run: |
          for script in ../frontend/test_*.cjs ../frontend/test_*.js; do
            if [ -f "$script" ]; then node "$script"; fi
          done
          npm run build
      - name: Chromium mobile smoke test
        working-directory: serverless
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.1
          npx playwright install --with-deps chromium
          node test/demo-browser.cjs
