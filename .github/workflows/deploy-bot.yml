name: deploy-bot
# Publishes the Telegram bot: automatically after a merge into main that changes the bot,
# or by hand: GitHub -> Actions -> deploy-bot -> Run workflow.
# Needs ONE repository secret, BOT_ENV: the full text of your local bot/.env file
# (BOT_TOKEN=..., TGCLOUD_TOKEN=..., GEMINI_API_KEY=... one per line).
on:
  workflow_dispatch:
  push:            # every merge into main that touches the bot publishes it automatically
    branches: [main]
    paths: ['serverless/**', 'bot/**', '.github/workflows/deploy-bot.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Write bot/.env from the secret
        env:
          BOT_ENV: ${{ secrets.BOT_ENV }}
        run: |
          test -n "$BOT_ENV" || { echo "Secret BOT_ENV is empty: add it in Settings -> Secrets and variables -> Actions"; exit 1; }
          printf '%s\n' "$BOT_ENV" > bot/.env
      - name: Tests
        working-directory: serverless
        run: |
          npm ci --ignore-scripts
          node --experimental-loader ./test/sdk-loader.mjs --test $(ls test/*.test.js | grep -v transport)
      - name: Deploy the bot code (not the Mini App)
        working-directory: serverless
        run: |
          npm run build
          # sync the local snapshot with what is live, then send ONLY the bot modules; no --force
          node cli.mjs fetch
          node cli.mjs push tgcloud
          node cli.mjs status
